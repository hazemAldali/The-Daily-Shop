name: Diagnose The Daily Shop startup crash

on:
  push:
    branches:
      - the-daily-shop-development
    paths:
      - ".github/workflows/diagnose-startup-crash.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # GitHub-hosted Linux runners may lack KVM. Explicitly allow Android Emulator's
    # software CPU emulation (TCG) instead of letting the emulator exit before ADB.
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Checkout development branch only
        uses: actions/checkout@v5
        with:
          ref: the-daily-shop-development

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build recovered APK from original DEX
        shell: bash
        run: |
          set -euo pipefail
          test -s recovery/app-release.apk
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar d --force --no-res recovery/app-release.apk -o build/apktool
          java -jar /tmp/apktool.jar b --force --no-res build/apktool -o /tmp/the-daily-shop-unsigned.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          keytool -genkeypair -noprompt -keystore /tmp/recovered-debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          "$BUILD_TOOLS/zipalign" -f 4 /tmp/the-daily-shop-unsigned.apk /tmp/the-daily-shop-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/recovered-debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out /tmp/the-daily-shop.apk /tmp/the-daily-shop-aligned.apk
          mkdir -p test-output
          cp /tmp/the-daily-shop.apk test-output/the-daily-shop.apk
          sha256sum /tmp/the-daily-shop.apk | tee test-output/apk-sha256.txt

      - name: Run clean-install startup test on Android 10 (API 29)
        id: emulator_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set +e
            mkdir -p test-output
            adb wait-for-device
            adb shell getprop ro.build.version.release > test-output/android-version.txt
            adb install -r /tmp/the-daily-shop.apk > test-output/install.txt 2>&1
            INSTALL_STATUS=$?
            adb logcat -c
            if [ "$INSTALL_STATUS" -eq 0 ]; then
              adb shell monkey -p com.hazem.dailystore -c android.intent.category.LAUNCHER 1 > test-output/launch.txt 2>&1
              sleep 15
              adb shell pidof com.hazem.dailystore > test-output/app-pid.txt 2>&1
              PID_STATUS=$?
            else
              PID_STATUS=1
            fi
            adb logcat -d -v threadtime > test-output/logcat-full.txt
            adb logcat -d -v threadtime AndroidRuntime:E System.err:E libc:F DEBUG:F '*:S' > test-output/crash-logcat.txt
            printf 'install_status=%s\nprocess_alive_status=%s\n' "$INSTALL_STATUS" "$PID_STATUS" > test-output/result.txt
            cat test-output/result.txt
            if [ "$INSTALL_STATUS" -ne 0 ] || [ "$PID_STATUS" -ne 0 ]; then
              echo "Startup smoke test failed; crash logs have been saved."
              exit 1
            fi

      - name: Upload startup diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: the-daily-shop-startup-diagnostics
          path: test-output/
          if-no-files-found: warn
          retention-days: 7
