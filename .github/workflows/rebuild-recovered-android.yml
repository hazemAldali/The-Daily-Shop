name: Rebuild Recovered Android Project
on:
  push:
    branches:
      - the-daily-shop-development
    paths:
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "app/**"
      - "recovery/decompiled/**"
      - ".github/workflows/rebuild-recovered-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovered-debug-build:
    name: Compile recovered Android source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v5
        with:
          ref: the-daily-shop-development
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify recovered inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f recovery/decompiled/RECOVERY_STATUS.txt
          test -f recovery/decompiled/resources/AndroidManifest.xml
          test -d recovery/decompiled/sources/com/hazem/dailystore
          grep -q 'DATABASE_VERSION = 33' recovery/decompiled/sources/com/hazem/dailystore/data/AppDatabase.java
          echo "Recovery inputs and schema version 33 verified."
          cat recovery/decompiled/RECOVERY_STATUS.txt
      - name: Stage app-owned JADX sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java
          while IFS= read -r -d '' file; do
            relative_path="${file#recovery/decompiled/sources/}"
            mkdir -p "app/src/main/java/$(dirname "$relative_path")"
            cp "$file" "app/src/main/java/$relative_path"
          done < <(find recovery/decompiled/sources/com/hazem/dailystore -type f -name '*.java' ! -name 'R.java' ! -name 'BuildConfig.java' -print0)
          echo "Staged $(find app/src/main/java -type f -name '*.java' | wc -l) application source files."
      - name: Replace decompiled AppCompat Nine-Patch assets with dependency originals
        shell: bash
        run: |
          set -euo pipefail
          resource_root="recovery/decompiled/resources/res"
          mapfile -d '' ninepatch_files < <(find "$resource_root" -type f -name '*.9.png' -print0)
          echo "Found ${#ninepatch_files[@]} decompiled Nine-Patch files."
          # The recovered APK contains only standard AppCompat resources here.
          # JADX preserved compiled Nine-Patch chunks in a form AAPT2 cannot rebuild.
          # AppCompat 1.7.0 supplies these exact resources from its AAR dependency.
          for file in "${ninepatch_files[@]}"; do
            name="$(basename "$file")"
            case "$name" in
              abc_*.9.png|notification_bg_*.9.png) ;;
              *)
                echo "::error::Unexpected custom Nine-Patch resource: $file"
                exit 1
                ;;
            esac
          done
          find "$resource_root" -type f \( -name 'abc_*.9.png' -o -name 'notification_bg_*.9.png' \) -delete
          remaining="$(find "$resource_root" -type f -name '*.9.png' | wc -l)"
          test "$remaining" -eq 0
          echo "Removed all ${#ninepatch_files[@]} decompiled AppCompat Nine-Patch copies; dependency AAR supplies originals."
      - name: Remove duplicate library attribute declarations from merged APK resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("recovery/decompiled/resources/res/values/attrs.xml")
          duplicate_names = {
              "navigationMode", "layout_scrollFlags", "tintMode", "tickMarkTintMode",
              "autoSizeTextType", "actionBarSize", "badgeGravity", "showAnimationBehavior",
              "fabAlignmentMode", "behavior_peekHeight", "carousel_alignment",
              "checkMarkTintMode", "indicatorDirectionCircular", "titleTextEllipsize",
              "layout_collapseMode", "buttonTintMode", "layout_anchorGravity",
              "extendStrategy", "fabSize", "fontProviderFetchStrategy", "fontStyle",
              "keyPositionType", "showDividers", "indeterminateAnimationType",
              "iconGravity", "checkedIconGravity", "buttonIconTintMode",
              "thumbIconTintMode", "logoScaleType", "alphabeticModifiers",
              "motionDebug", "telltales_velocityMode", "labelVisibilityMode",
              "menuGravity", "clickAction", "nestedScrollFlags", "cornerFamily",
              "labelBehavior", "animationMode", "thumbTintMode", "tabIndicatorGravity",
              "errorIconTintMode", "buttonGravity", "autoTransition", "backgroundTintMode",
          }
          tree = ET.parse(path)
          root = tree.getroot()
          removed = []
          for element in list(root):
              if element.tag == "attr" and element.attrib.get("name") in duplicate_names:
                  removed.append(element.attrib["name"])
                  root.remove(element)
          missing = duplicate_names - set(removed)
          if missing:
              raise SystemExit("Expected duplicate attr declarations not found: " + ", ".join(sorted(missing)))
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print(f"Removed {len(removed)} APK-bundled library attr declarations; AAR dependencies provide them.")
          PY
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK and build reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: recovered-android-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            app/build/tmp/compileDebugJavaWithJavac/**
          if-no-files-found: warn
          retention-days: 14
