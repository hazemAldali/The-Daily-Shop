name: Rebuild Recovered Android Project
on:
  push:
    branches:
      - the-daily-shop-development
    paths:
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "app/**"
      - "recovery/decompiled/**"
      - ".github/workflows/rebuild-recovered-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovered-debug-build:
    name: Compile recovered Android source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v5
        with:
          ref: the-daily-shop-development
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify recovered inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f recovery/decompiled/RECOVERY_STATUS.txt
          test -f recovery/decompiled/resources/AndroidManifest.xml
          test -d recovery/decompiled/sources/com/hazem/dailystore
          grep -q 'DATABASE_VERSION = 33' recovery/decompiled/sources/com/hazem/dailystore/data/AppDatabase.java
          echo "Recovery inputs and schema version 33 verified."
          cat recovery/decompiled/RECOVERY_STATUS.txt
      - name: Stage app-owned JADX sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java
          while IFS= read -r -d '' file; do
            relative_path="${file#recovery/decompiled/sources/}"
            mkdir -p "app/src/main/java/$(dirname "$relative_path")"
            cp "$file" "app/src/main/java/$relative_path"
          done < <(find recovery/decompiled/sources/com/hazem/dailystore -type f -name '*.java' ! -name 'R.java' ! -name 'BuildConfig.java' -print0)
          echo "Staged $(find app/src/main/java -type f -name '*.java' | wc -l) application source files."
      - name: Replace decompiled AppCompat Nine-Patch assets with dependency originals
        shell: bash
        run: |
          set -euo pipefail
          resource_root="recovery/decompiled/resources/res"
          mapfile -d '' ninepatch_files < <(find "$resource_root" -type f -name '*.9.png' -print0)
          echo "Found ${#ninepatch_files[@]} decompiled Nine-Patch files."
          # The recovered APK contains only standard AppCompat resources here.
          # JADX preserved compiled Nine-Patch chunks in a form AAPT2 cannot rebuild.
          # AppCompat 1.7.0 supplies these exact resources from its AAR dependency.
          for file in "${ninepatch_files[@]}"; do
            name="$(basename "$file")"
            case "$name" in
              abc_*.9.png|notification_bg_*.9.png) ;;
              *)
                echo "::error::Unexpected custom Nine-Patch resource: $file"
                exit 1
                ;;
            esac
          done
          find "$resource_root" -type f \( -name 'abc_*.9.png' -o -name 'notification_bg_*.9.png' \) -delete
          remaining="$(find "$resource_root" -type f -name '*.9.png' | wc -l)"
          test "$remaining" -eq 0
          echo "Removed all ${#ninepatch_files[@]} decompiled AppCompat Nine-Patch copies; dependency AAR supplies originals."
      - name: Resolve Android libraries and remove APK-bundled duplicate value resources
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/resolve-android-aars.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              def app = gradle.rootProject.project(":app")
              app.tasks.register("resolveDebugRuntimeAars") {
                  doLast {
                      def artifacts = app.configurations
                          .getByName("debugRuntimeClasspath")
                          .resolvedConfiguration.resolvedArtifacts
                      def aars = artifacts.findAll { it.file.name.endsWith(".aar") }
                      println("Resolved " + aars.size() + " Android AAR dependencies.")
                      aars.each { println("AAR_RESOURCE_SOURCE=" + it.file.absolutePath) }
                  }
              }
          }
          GRADLE
          gradle --no-daemon -I /tmp/resolve-android-aars.gradle :app:resolveDebugRuntimeAars
          python3 - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          aar_root = Path.home() / ".gradle/caches/modules-2/files-2.1"
          library_symbols = set()
          aar_count = 0
          aar_xml_count = 0
          for aar_path in aar_root.rglob("*.aar"):
              try:
                  with zipfile.ZipFile(aar_path) as archive:
                      aar_count += 1
                      for entry in archive.namelist():
                          if not entry.startswith("res/values") or not entry.endswith(".xml"):
                              continue
                          try:
                              root = ET.fromstring(archive.read(entry))
                          except ET.ParseError:
                              continue
                          aar_xml_count += 1
                          for child in root:
                              name = child.attrib.get("name")
                              if child.tag == "item":
                                  resource_type = child.attrib.get("type")
                              else:
                                  resource_type = child.tag
                              if name and resource_type not in {"public", "eat-comment"}:
                                  library_symbols.add((resource_type, name))
                          for attr in root.iter("attr"):
                              if attr.attrib.get("name"):
                                  library_symbols.add(("attr", attr.attrib["name"]))
              except (OSError, zipfile.BadZipFile):
                  continue

          if not library_symbols:
              raise SystemExit("No Android AAR value resources found after dependency resolution.")

          res_root = Path("recovery/decompiled/resources/res")
          removed = Counter()
          scanned = 0
          for xml_path in res_root.glob("values*/*.xml"):
              if xml_path.name == "public.xml":
                  xml_path.unlink()
                  removed["public-index"] += 1
                  continue
              try:
                  tree = ET.parse(xml_path)
              except ET.ParseError:
                  continue
              root = tree.getroot()
              changed = False
              for element in list(root):
                  name = element.attrib.get("name")
                  if element.tag == "item":
                      resource_type = element.attrib.get("type")
                  else:
                      resource_type = element.tag
                  if name and (resource_type, name) in library_symbols:
                      root.remove(element)
                      removed[resource_type] += 1
                      changed = True
              if changed:
                  tree.write(xml_path, encoding="utf-8", xml_declaration=True)
              scanned += 1

          print(f"Scanned {aar_count} AARs / {aar_xml_count} library values XML files.")
          print(f"Compared against {len(library_symbols)} library resource symbols across {scanned} APK values files.")
          print("Removed duplicate resource definitions:", dict(removed))
          PY
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK and build reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: recovered-android-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            app/build/tmp/compileDebugJavaWithJavac/**
          if-no-files-found: warn
          retention-days: 14
